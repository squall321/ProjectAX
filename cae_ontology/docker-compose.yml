version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: cae_ontology_db
    environment:
      POSTGRES_DB: cae_ontology
      POSTGRES_USER: cae_admin
      POSTGRES_PASSWORD: cae_dev_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"

volumes:
  pgdata:
